<title>Butterfly flight — Scene 1 mock harness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  *{margin:0; padding:0; box-sizing:border-box}
  html,body{height:100%}
  body{overflow:hidden; background:#fbf7f1; font-family:'Cormorant Garamond',serif}

  /* ===== Scene 1 mock (matches index.html s-couple) ===== */
  .scene{
    position:fixed; inset:0; min-height:100dvh; overflow:hidden;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:28px 30px; gap:clamp(13px,2.2dvh,21px);
    background:linear-gradient(180deg,#fbf7f1,#f4f1e6);
  }
  .col{display:flex; flex-direction:column; align-items:center; gap:clamp(13px,2.2dvh,21px)}
  .bismillah{font-family:'Amiri Quran',serif; font-size:clamp(40px,12vw,52px); line-height:1.9; color:#B8923E}
  .hdr-divider{width:72px; height:1px; background:rgba(184,146,62,.6); margin:16px auto}
  .host{font-size:clamp(24px,7vw,30px); color:#6B5E4E; letter-spacing:.04em}
  .hdr-line{font-style:italic; font-size:clamp(20px,5.5vw,25px); color:#8A7B66; margin-top:8px}
  .dua-e-khair{font-family:'Great Vibes',cursive; font-weight:400; font-size:clamp(48px,14vw,64px);
    line-height:1.25; color:#7A2E2E; margin:8px 0 2px; white-space:nowrap}
  .daughter-name{font-family:'Great Vibes',cursive; font-weight:400; font-size:clamp(42px,12vw,56px);
    line-height:1.2; color:#B8923E; margin-top:7px}
  .more{position:absolute; left:0; right:0; bottom:calc(env(safe-area-inset-bottom,0px) + 72px);
    display:flex; flex-direction:column; align-items:center; gap:6px;
    font-size:15.5px; letter-spacing:.06em; color:#8A7B66}

  /* ===== butterflies (decorative layer) ===== */
  .flyer{
    position:fixed; z-index:5; pointer-events:none;
    will-change:transform; opacity:0;
  }
  .flyer svg{display:block; width:100%; height:auto; overflow:visible}
  .flyer.on{opacity:1}
  #hero{left:50%; top:1.5dvh; width:min(30vw,140px); margin-left:calc(min(30vw,140px)/-2)}

  .bft path{
    stroke:#B8923E; fill:none; stroke-linecap:round; stroke-linejoin:round;
    stroke-dasharray:1; stroke-dashoffset:1;
  }
  .bft .w14{stroke-width:1.4}
  .bft .w9{stroke-width:.9}
  .bft.play path{animation:draw .9s cubic-bezier(.33,1,.68,1) forwards; animation-delay:calc(var(--o,0)*.22s)}
  @keyframes draw{to{stroke-dashoffset:0}}
  .bft .wash path{stroke:none; stroke-dasharray:none; stroke-dashoffset:0; fill:#C9B8E8; opacity:0}
  .bft.play .wash path{animation:washIn .6s ease forwards; animation-delay:2.1s}
  @keyframes washIn{to{opacity:var(--op,.15)}}
  .bft.drawn path{stroke-dashoffset:0; animation:none}
  .bft.drawn .wash path{opacity:var(--op,.15); animation:none}

  /* wing flap: scaleX about the body line (viewBox x=100) */
  .flapper{transform-box:view-box; transform-origin:50% 50%}
  .flyer.flying .flapper{animation:flap var(--fl,.5s) ease-in-out infinite}
  .flyer.resting .flapper{animation:none; transition:transform .8s ease-out; transform:scaleX(1)}
  @keyframes flap{0%,100%{transform:scaleX(1)} 50%{transform:scaleX(.55)}}

  @media (prefers-reduced-motion: reduce){
    .bft path{stroke-dashoffset:0 !important; animation:none !important}
    .bft .wash path{opacity:var(--op,.15) !important}
    .flyer .flapper{animation:none !important}
  }
</style>
</head>

        <path class="w9" pathLength="1" d="M98.7 81.3
          C97.5 73 96.5 64 93.5 56.5
          C91 50.5 86.5 45.8 81.4 43.6
          C78.4 42.3 74.6 41.4 73.1 43.5
          C71.7 45.5 73.1 48.2 75.6 48.1
          C77.5 48 78.6 46.5 78 45
          C77.6 44 76.5 43.6 75.7 44.2"/>
      </g>
    </svg>
  </div>

<script>
(function(){
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var hero = document.getElementById('hero');
  var heroSvg = hero.querySelector('svg');

  // mirror the authored half into every instance's empty half
  function mirror(svg){
    svg.querySelector('.half-dst').innerHTML = svg.querySelector('.half-src').innerHTML;
  }
  mirror(heroSvg);

  if (reduce){ heroSvg.classList.add('drawn'); return; } // static hero, no flight, no minis

  heroSvg.classList.add('play');           // draw-on 0–2.0s, wash 2.1–2.7s

  var FLY_AT = 2850;                       // flight begins after wash settles
  var W = innerWidth, H = innerHeight;
  var heroW = hero.getBoundingClientRect().width;
  var heroCx = .5*W;                       // hero's starting center x
  var heroCy = hero.getBoundingClientRect().top + heroW/2;

  // measure the text block's widest edges — the flight lanes are derived, never assumed
  var texts = [].slice.call(document.querySelectorAll('#col > *'));
  var L = Math.min.apply(null, texts.map(function(e){return e.getBoundingClientRect().left}));
  var R = Math.max.apply(null, texts.map(function(e){return e.getBoundingClientRect().right}));

  // hero: lifts from its spot, dips partway down the LEFT margin lane, sweeps back
  // up the same lane, traverses the safe blank strip above the Bismillah, and
  // settles exactly where it started. May ride half-clipped where the lane is narrow.
  function cxAt(s){ return L - (heroW*s)/2*1.2 - 2; } // 1.2 = AABB slack for the flight tilt
  var HERO_DUR = 4800;
  hero.animate([
    { transform:'translate(0,0) rotate(0deg) scale(1)',                                         offset:0   },
    { transform:'translate('+(( .38*W)-heroCx)+'px,'+(-.015*H)+'px) rotate(-8deg) scale(.95)',  offset:.10 },
    { transform:'translate('+(( .12*W)-heroCx)+'px,'+( .045*H)+'px) rotate(-12deg) scale(.78)', offset:.22 },
    { transform:'translate('+(cxAt(.62)-heroCx)+'px,'+( .075*H)+'px) rotate(-8deg) scale(.62)', offset:.32 },
    { transform:'translate('+(cxAt(.56)-heroCx)+'px,'+( .28*H)+'px) rotate(-14deg) scale(.56)', offset:.48 },
    { transform:'translate('+(cxAt(.56)-heroCx)+'px,'+( .40*H)+'px) rotate(0deg) scale(.56)',   offset:.58 },
    { transform:'translate('+(cxAt(.60)-heroCx)+'px,'+( .18*H)+'px) rotate(10deg) scale(.62)',  offset:.72 },
    { transform:'translate('+(cxAt(.66)-heroCx)+'px,'+( .06*H)+'px) rotate(12deg) scale(.68)',  offset:.80 },
    { transform:'translate('+(( .30*W)-heroCx)+'px,'+( .005*H)+'px) rotate(6deg) scale(.86)',   offset:.90 },
    { transform:'translate(0,0) rotate(0deg) scale(1)',                                         offset:1   }
  ], {duration:HERO_DUR, delay:FLY_AT, easing:'ease-in-out', fill:'forwards'});

  // 3 minis EMERGE from the hero's spot as it lifts, then peel onto margin lanes
  // (1 left, 2 right); all exit off the sides/bottom
  var minis = [
    {side:'L', scale:.26, sideExit:0,   delay:FLY_AT+150, dur:3600, dir:1,  fl:'.46s'},
    {side:'R', scale:.30, sideExit:.4,  delay:FLY_AT+400, dur:3400, dir:-1, fl:'.52s'},
    {side:'R', scale:.22, sideExit:0,   delay:FLY_AT+650, dur:3700, dir:-1, fl:'.42s'}
  ];

  minis.forEach(function(m){
    var gap = (m.side==='L') ? L : (W-R);
    var w = Math.min(heroW*m.scale, (gap-4)/1.24); // 1.24 = AABB slack for tilt
    var laneCx = (m.side==='L') ? L/2 : R + gap/2;
    var sway = Math.max(1.5, (gap - w*1.24)/2 - 1) * (m.side==='L' ? 1 : -1);
    var d = document.createElement('div');
    d.className = 'flyer on';
    d.setAttribute('aria-hidden','true');
    d.style.width = w+'px';
    d.style.left = (heroCx - w/2)+'px';      // spawn AT the hero's spot
    d.style.top = (heroCy - w/2)+'px';
    d.style.opacity = '0';
    d.style.setProperty('--fl', m.fl);
    var svg = heroSvg.cloneNode(true);
    svg.classList.remove('play');
    svg.classList.add('drawn');              // minis are already inked
    d.appendChild(svg);
    document.body.appendChild(d);
    var laneDx = laneCx - heroCx;
    var drop = H + 2.8*w;
    var laneY = Math.max(0, .09*H - (heroCy - w/2)); // lane entry height: box bottom stays above the Bismillah
    var emerge = 300 / m.dur;                // 0.3s scale/fade-in at the hero's spot
    var frames = [
      { opacity:0, transform:'translate(0,0) rotate(0deg) scale(.6)',                                   offset:0 },
      { opacity:1, transform:'translate('+(laneDx*.2)+'px,'+(laneY*.3)+'px) rotate('+(6*m.dir)+'deg) scale(1)', offset:emerge },
      { opacity:1, transform:'translate('+laneDx+'px,'+laneY+'px) rotate('+(12*m.dir)+'deg) scale(1)',  offset:.30 }
    ];
    if (m.sideExit){
      frames.push({ opacity:1, transform:'translate('+(laneDx+sway)+'px,'+(.34*drop)+'px) rotate('+(16*m.dir)+'deg) scale(1)', offset:.62 });
      frames.push({ opacity:1, transform:'translate('+(laneDx + m.dir*-1*m.sideExit*W)+'px,'+(.5*drop)+'px) rotate('+(24*m.dir)+'deg) scale(1)', offset:1 });
    } else {
      frames.push({ opacity:1, transform:'translate('+(laneDx+sway)+'px,'+(.42*drop)+'px) rotate('+(15*m.dir)+'deg) scale(1)', offset:.60 });
      frames.push({ opacity:1, transform:'translate('+(laneDx-sway)+'px,'+(.74*drop)+'px) rotate('+(6*m.dir)+'deg) scale(1)',  offset:.82 });
      frames.push({ opacity:1, transform:'translate('+(laneDx+sway*.5)+'px,'+(1.04*drop)+'px) rotate('+(13*m.dir)+'deg) scale(1)', offset:1 });
    }
    d.animate(frames, {duration:m.dur, delay:m.delay, easing:'ease-in-out', fill:'both'});
    setTimeout(function(){ d.classList.add('flying'); }, m.delay);
  });

  setTimeout(function(){ hero.classList.add('flying'); }, FLY_AT);
  // wings ease to rest over the final ~0.8s of the return
  setTimeout(function(){ hero.classList.add('resting'); hero.classList.remove('flying'); }, FLY_AT + HERO_DUR - 500);

  // ===== harness-only helpers for review =====
  window.__seek = function(ms){
    document.getAnimations().forEach(function(a){ a.pause(); a.currentTime = ms; });
  };
  window.__check = function(times){
    var texts = [].slice.call(document.querySelectorAll('#col > *'));
    return times.map(function(t){
      window.__seek(t);
      var worst = 0, hit = false;
      [].forEach.call(document.querySelectorAll('.flyer'), function(f){
        var r = f.getBoundingClientRect();
        texts.forEach(function(el){
          var c = el.getBoundingClientRect();
          var ox = Math.min(r.right,c.right) - Math.max(r.left,c.left);
          var oy = Math.min(r.bottom,c.bottom) - Math.max(r.top,c.top);
          if (ox > 0 && oy > 0){ hit = true; worst = Math.max(worst, Math.min(ox,oy)); }
        });
      });
      return {t:t, anyOverText:hit, worstOverlapPx:Math.round(worst)};
    });
  };
})();
</script>
